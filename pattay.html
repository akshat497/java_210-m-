<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .cards{
            position: absolute;
        }
        #first{
            left: 50px;
            transition: all 1s;
            
        }
        #second{
            left: 30px;
                    transition: all 1s;

        }
        #first:hover{
            transform: translateX(100px) rotate(180deg) scale(1.5) translateY(-20px);

        }
        #second:hover{
              transform: translateX(80px) rotate(180deg ) scale(1.5);


        }
    </style>
</head>
<body>

    <img id="first" height="100" width="100" class="cards" src="./ace.jpeg"></img>
    <img id="second" height="100" width="100" class="cards" src="./king_of_hearts2.png"></img>
    <img id="third" height="100" width="100" class="cards" src="./kink_black.jpeg"></img>
    
</body>
</html>
