<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <input
      type="search"
      placeholder="Search......"
      id="searchBar"
      onkeyup="getUserInput()"
    />
    <table border="1">
      <thead id="thead"></thead>
      <tbody id="tbody"></tbody>
    </table>
    <script>
      let users;
      let keys;
      let userInput;
      let copy;

      async function getData() {
        let response = await fetch(
          "https://jsonplaceholder.typicode.com/users",
        );
        let data = await response.json();
        console.log(data);
        users = data;
        keys = Object.keys(users[0]);
        copy = users;
        console.log(keys);
        displayHeader();
        displayUsers();
      }
      getData();
      function getUserInput() {
        let userInput = document.getElementById("searchBar");

        let filteredValues = users.filter(function (user) {
          return user.name
            .toLowerCase()
            .includes(userInput.value.toLowerCase());
        });

        displayUsers(filteredValues, true);
      }
      function displayHeader() {
        let tHead = document.getElementById("thead");
        let tr = document.createElement("tr");

        keys.forEach((key) => {
          let th = document.createElement("th");
          th.innerText = key;
          tr.append(th);
        });
         tHead.append(tr); 
      }
      function displayUsers(array = users, search = false) {
        let tBody = document.getElementById("tbody");

        // clear old rows
        tBody.innerHTML = "";

       
        array.forEach((key) => {
          let tr = document.createElement("tr");

          let values = [
            key.id,
            key.name,
            key.username,
            key.email,
            key.address.street,
            key.phone,
            key.website,
            key.company.name,
          ];

          values.forEach((value) => {
            let td = document.createElement("td");
            td.innerText = value;
            tr.append(td);
          });

          tBody.append(tr);
        });
      }
    </script>
  </body>
</html>
