<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>

    <style>
      .display {
        height: 120px;
        width: 100px;
        margin: 4%;
        border: 2px solid black;
        padding: 1%;
        /* display: inline; */
        /* display: inline-block; */
        /* display: block; */
        /* display: none */
        display: flex;
      }
      .parent {
        height: 100vh;
        border: 2px solid red;
        padding: 1%;
        display: grid;
        grid-template-columns: 110px 110px 110px 110px 110px;
        gap: 40px;
        justify-content: center;
        /* display: flex;
              flex-wrap: wrap;
              justify-content: center;
              overflow: scroll; */

        /* flex-direction: column;
                  justify-content: center;
                  align-items: center; */
      }
      .display:hover {
        scale: 2;
      }
      .animation {
        /* animation-name: slide;
              animation-duration: 2s;
              animation-timing-function: ease-in;
              animation-delay: 2s;
              animation-iteration-count: infinite;
              animation-fill-mode: forwards;
              animation-play-state: running; */

        animation: slide 2s ease-in 2s infinite alternate;
      }

      @keyframes slide {
        0% {
          background-color: red;
          transform: translateX(0px) scale(1) rotate(0deg);
        }
        50% {
          background-color: yellow;
           transform: translateX(100px) scale(1.2) rotate(60deg);
        }
        100% {
          background-color: green;
          transform: translateX(0px) scale(1) rotate(0deg);
        }
      }
    </style>
  </head>
  <body>
    <!-- animation in css -->

    <div class="display animation">1</div>
    <!-- //display properties in css -->

    <div class="parent">
      <div class="display" id="display1">1</div>
      <div class="display" id="display2">2</div>
      <div class="display" id="display3">3</div>
      <div class="display" id="display4">4</div>
      <div class="display" id="display4">4</div>
      <div class="display" id="display4">4</div>
      <div class="display" id="display4">4</div>
      <div class="display" id="display4">4</div>
      <div class="display" id="display4">4</div>
      <div class="display" id="display4">4</div>
      <div class="display" id="display4">4</div>
      <div class="display" id="display4">4</div>
      <div class="display" id="display4">4</div>
      <div class="display" id="display4">4</div>
      <div class="display" id="display4">4</div>
      <div class="display" id="display4">4</div>
      <div class="display" id="display4">4</div>
      <div class="display" id="display4">4</div>
      <div class="display" id="display4">4</div>
      <div class="display" id="display4">4</div>
      <div class="display" id="display4">4</div>
      <div class="display" id="display4">4</div>
      <div class="display" id="display4">4</div>
      <div class="display" id="display4">4</div>
    </div>
  </body>
</html>
