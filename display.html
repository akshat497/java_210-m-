<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>

    <style>
      .display {
        height: 120px;
        width: 100px;
        margin: 4%;
        border: 2px solid black;
        padding: 1%;
        background-color: black;
        opacity: 1;
        /* display: inline; */
        /* display: inline-block; */
        /* display: block; */
        /* display: none */
        display: flex;
      }
      .parent {
        height: 100vh;
        border: 2px solid red;
        padding: 1%;
        display: grid;
        grid-template-columns: 110px 110px 110px 110px 110px;
        gap: 40px;
        justify-content: center;
        /* display: flex;
              flex-wrap: wrap;
              justify-content: center;
              overflow: scroll; */

        /* flex-direction: column;
                  justify-content: center;
                  align-items: center; */
      }
      .display:hover {
        scale: 2;
      }
      .animation {
        /* animation-name: slide;
              animation-duration: 2s;
              animation-timing-function: ease-in;
              animation-delay: 2s;
              animation-iteration-count: infinite;
              animation-fill-mode: forwards;
              animation-play-state: running; */

        animation: slide 2s ease-in 2s infinite alternate;
      }

      @keyframes slide {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }

      /* @keyframes slide {
        0% {
          background-color: red;
          transform: translateX(0px) scale(1) rotate(0deg);
        }
        50% {
          background-color: yellow;
           transform: translateX(100px) scale(1.2) rotate(60deg);
        }
        100% {
          background-color: green;
          transform: translateX(0px) scale(1) rotate(0deg);
        }
      } */

      .container {
        display: flex;
        gap: 20px;
        font-size: larger;
        font-weight: bolder;
        border: 1px solid black;
        padding: 1%;
        align-items: center;
        justify-content: center;
        overflow: hidden;
      }
      .content {
        /* border: 1px solid red; */
        padding: 1%;
        animation: moving 10s linear infinite;
      }
      @keyframes moving {
        from {
          transform: translateX(-800px);
        }
        to {
          transform: translateX(800px) scale(1.1);
        }
      }

      .ball {
        position: relative;
        top: 100px;
        height: 50px;
        width: 50px;
        border: 2px solid red;
        border-radius: 50%;
        animation: bounce 1s ease-in infinite alternate;
      }

      .floor {
        border-bottom: 2px solid black;
        position: relative;
        top: 100px;
      }

      @keyframes bounce {
        from {
          transform: translateY(-60px) translateX(0px);
        }
        to {
          transform: translateY(0px) translateX(100px);
        }
      }
    </style>
  </head>
  <body>
    <div class="ball"></div>
    <div class="floor"></div>
