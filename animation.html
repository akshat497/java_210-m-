      .container {
        display: flex;
        gap: 15px;
      }
      .box {
        height: 100px;
        width: 100px;
        background-color: gray;
        animation: focusMove 5s steps(1) infinite;
      }
      .box:nth-child(1) {
        animation-delay: 0s;
      }
      .box:nth-child(2) {
        animation-delay: 1s;
      }
      .box:nth-child(3) {
        animation-delay: 2s;
      }
      .box:nth-child(4) {
        animation-delay: 3s;
      }
      .box:nth-child(5) {
        animation-delay: 4s;
      }

      @keyframes focusMove {
        0%{
            transform: translateY(0) scale(1);
            background-color: lime;
        }
        1%{
              transform: translateY(-25px) scale(1.2);
            background-color: lime;

        }
        20%{
                transform: translateY(-25px) scale(1.2);
            background-color: lime;

        }
        21%{
              transform: translateY(0) scale(1);
            background-color: gray;
        }
        100%{
             transform: translateY(0) scale(1);
            background-color: lime;
        }
        
      }
    </style>
